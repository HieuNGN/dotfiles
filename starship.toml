"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = """
$directory\
$os\
$git_branch\
$git_status\
$git_metrics\
$conda\
$python\
$nodejs\
$rust\
$golang\
$php\
$lua\
$docker_context\
$kubernetes\
$cmd_duration\
$line_break\
$character"""

# ── OS ──────────────────────────────────────────────────────────────
[os]
disabled = false
format = '[$symbol](#aad0ee) '

[os.symbols]
Ubuntu = '󰕈'
Arch   = '󰣇'
Macos  = ''
Fedora = ''
Debian = ''
Linux  = ''

# ── Directory ───────────────────────────────────────────────────────
[directory]
format            = '[$path]($style)[$read_only]($read_only_style) '
truncation_length = 4
truncate_to_repo  = true
read_only         = ' 󰌾'
read_only_style   = 'red'
style             = 'bold cyan'
repo_root_style   = 'bold cyan'
home_symbol       = '~'

# ── Git Branch ──────────────────────────────────────────────────────
[git_branch]
symbol    = ''
format    = '[$symbol $branch]($style) '
style     = 'bold purple'

# ── Git Status ──────────────────────────────────────────────────────
[git_status]
format    = '([$all_status$ahead_behind]($style)) '
style     = 'bold red'
ahead     = '⇡[$count](bold green) '
behind    = '⇣[$count](bold red) '
diverged  = '⇕⇡[$ahead_count](bold green)⇣[$behind_count](bold red) '
staged    = '[+$count](bold green) '
modified  = '[!$count](bold yellow) '
untracked = '[?$count](bold white) '
deleted   = '[-$count](bold red) '
conflicted= '[=$count](bold red) '
renamed   = '[$count](bold yellow) '
stashed   = '[$count](bold blue) '

# ── Git Metrics (inline +/− diff counts) ────────────────────────────
[git_metrics]
disabled = false
format      = '([+$added]($added_style) )([-$deleted]($deleted_style) )'
added_style   = 'bold green'
deleted_style = 'bold red'
only_nonzero_diffs = true

# ── Conda ───────────────────────────────────────────────────────────
[conda]
symbol             = ''
format             = '[$symbol $environment]($style) '
style              = 'bold blue dimmed'
ignore_base        = false
truncation_length  = 15

# ── Python (incl. uv/venv) ──────────────────────────────────────────
[python]
symbol      = ''
format      = '[${symbol}${pyenv_prefix}(${version})(\($virtualenv\))]($style) '
style       = 'bold yellow'
pyenv_prefix = 'pyenv '
version_format = 'v${raw}'

# ── Node.js ─────────────────────────────────────────────────────────
[nodejs]
symbol    = ''
format    = '[$symbol $version]($style) '
style     = 'bold green'

# ── Rust ────────────────────────────────────────────────────────────
[rust]
symbol    = ''
format    = '[$symbol $version]($style) '
style     = 'bold red'

# ── Go ──────────────────────────────────────────────────────────────
[golang]
symbol    = ''
format    = '[$symbol $version]($style) '
style     = 'bold cyan'

# ── PHP ─────────────────────────────────────────────────────────────
[php]
symbol    = ''
format    = '[$symbol $version]($style) '
style     = 'bold purple'

# ── Lua ─────────────────────────────────────────────────────────────
[lua]
symbol    = ''
format    = '[$symbol $version]($style) '
style     = 'bold blue'

# ── Docker Context ──────────────────────────────────────────────────
[docker_context]
symbol    = ''
format    = '[$symbol $context]($style) '
style     = 'bold blue'
disabled  = false

# ── Kubernetes ──────────────────────────────────────────────────────
[kubernetes]
symbol      = '☸'
format      = '[$symbol $context( \($namespace\))]($style) '
style       = 'bold blue'
disabled    = false
context_aliases = { "k3s" = "k3s", "minikube" = "mini" }

# ── Command Duration ────────────────────────────────────────────────
[cmd_duration]
min_time          = 2000
format            = '[$duration]($style) '
style             = 'bold yellow'
show_milliseconds = false

# ── Character (prompt symbol) ──────────────────────────────────────
[character]
success_symbol = '[❯](bold green)'
error_symbol   = '[❯](bold red)'
vimcmd_symbol  = '[❮](bold blue)'
vimcmd_replace_one_symbol = '[❮](bold purple)'
vimcmd_replace_symbol     = '[❮](bold purple)'
vimcmd_visual_symbol      = '[❮](bold cyan)'